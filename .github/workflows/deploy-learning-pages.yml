name: Publish learning pages

on:
  push:
    branches: [main]
    paths:
      - fin-signal-service/LEARNING_PROGRESS.html
      - fin-signal-service/LEARNING_PROGRESS.md
      - .github/workflows/deploy-learning-pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare learning website
        run: |
          mkdir -p _site
          cp fin-signal-service/LEARNING_PROGRESS.html _site/index.html
          cp fin-signal-service/LEARNING_PROGRESS.md _site/LEARNING_PROGRESS.md

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
